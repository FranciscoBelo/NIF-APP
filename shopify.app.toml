# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "nif-validation-app"
client_id = "" # Add your Shopify Partner client ID
application_url = "https://your-app-url.com" # Update with your app URL
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_customers,write_draft_orders,write_orders,read_checkouts"

[auth]
redirect_urls = [
  "https://your-app-url.com/auth/callback",
  "https://your-app-url.com/auth/shopify/callback",
  "https://your-app-url.com/api/auth/callback"
]

[webhooks]
api_version = "2024-01"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
dev_store_url = "" # Add your development store URL
